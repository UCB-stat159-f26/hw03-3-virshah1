[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-analysis-virshah1"
version = "0.1.0"
description = "Python package for analyzing tennis player career matches"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "matplotlib",
    "requests"
]

[tool.setuptools.packages.find]
include = ["tennis_analysis*"]
